spring.application.name=zoo-api
server.port=${PORT:9000}

# Database: override with environment variables, never commit real credentials
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zoo}
spring.datasource.username=${DB_USERNAME:zoo}
spring.datasource.password=${DB_PASSWORD:zoo}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RFC 9457 problem details for all errors
spring.mvc.problemdetails.enabled=true

# Seed demo data on first start
zoo.seed-data=${SEED_DATA:true}
